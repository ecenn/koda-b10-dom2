<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampu Lalu Lintas - DOM</title>
    <style>
        .container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 350px;
            height: 700px;
            background-color: black;
            border-radius: 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .container > div {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: darkslategrey;
        }
        #red {
            background-color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="red"></div>
        <div id="yellow"></div>
        <div id="green"></div>
    </div>

    <script>
        const red = document.getElementById("red")
        const yellow = document.getElementById("yellow")
        const green = document.getElementById("green")
        function trafficlight() {
            window.setTimeout(() => {
                red.setAttribute("style", "background-color: darkslategrey")
                yellow.setAttribute("style", "background-color: yellow")
                window.setTimeout(() => {
                    yellow.setAttribute("style", "background-color: darkslategrey")
                    green.setAttribute("style", "background-color: green")
                    window.setTimeout(() => {
                        green.setAttribute("style", "background-color: darkslategrey")
                        red.setAttribute("style", "background-color: red")
                        trafficlight()
                    }, 3000)
                }, 2000)
            }, 3000)
        }
        trafficlight()
    </script>
</body>
</html>
